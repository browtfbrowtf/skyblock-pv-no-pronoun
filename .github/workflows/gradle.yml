name: Build Release

# Controls when the action will run.
# Publishes a rolling "latest" release on every push to master (this is the
# branch this fork maintains), and can also be triggered manually.
on:
  workflow_dispatch:
  push:
    branches:
      - master

# The built-in GITHUB_TOKEN can publish a release in THIS repo with contents:write,
# so no custom API key / PAT is required.
permissions:
  contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version: [ '26.1', '26.2', '26.3' ]
        steps:
            -   uses: actions/checkout@v5
            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '25'
            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew
            -   name: Build
                run: ./gradlew :${{ matrix.version }}:build
            -   name: Upload Artifact ${{ matrix.version }}
                uses: actions/upload-artifact@v7.0.0
                with:
                    archive: false
                    path: build/libs/*-${{ matrix.version }}.jar

    # Rolling release: runs ONCE after all matrix legs finish, so the single
    # "latest" release carries every MC-version jar.
    #
    # We publish it deterministically with curl + the built-in GITHUB_TOKEN
    # instead of softprops/action-gh-release, which is stateful and NOT
    # idempotent against a fixed "latest" tag (it deletes all existing assets
    # first, then re-uploads — a transient failure mid-way, e.g. a secondary
    # rate limit, leaves the release in a broken/partial state). This job:
    #   1. moves the 'latest' tag to the new commit,
    #   2. atomically deletes any existing 'latest' release (drops ALL its
    #      assets in a single call, which also self-heals any broken state),
    #   3. creates a fresh 'latest' release,
    #   4. uploads exactly the built SkyBlockPv jars.
    # Reusing the fixed "latest" tag means each run overwrites the same
    # release, so the repo's Latest release is always the freshest build.
    release:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
            GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            GH_SHA: "${{ github.sha }}"
        steps:
            -   name: Download build artifacts
                uses: actions/download-artifact@v4
                with:
                    path: release-assets
            -   name: Publish GitHub Release (rolling "latest", deterministic)
                run: |
                    set -euo pipefail
                    BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}"
                    AUTH=(-H "Authorization: token ${GH_TOKEN}")
                    CT=(-H "Content-Type: application/json")

                    # Collect the built jars (one per MC version). download-artifact
                    # (archive:false) places each matrix artifact in its own
                    # subfolder, so glob for jars under any subfolder.
                    shopt -s nullglob
                    JARS=( release-assets/*/SkyBlockPv-*.jar release-assets/SkyBlockPv-*.jar )
                    shopt -u nullglob
                    # De-dup (in case a jar is matched by both patterns).
                    mapfile -t JARS < <(printf '%s\n' "${JARS[@]}" | sort -u)
                    if [ ${#JARS[@]} -eq 0 ]; then
                        echo "::error::No SkyBlockPv-*.jar found under release-assets/"
                        ls -laR release-assets
                        exit 1
                    fi
                    echo "Jars to publish:"
                    ls -l "${JARS[@]}"

                    # 1) Move (or create) the 'latest' tag to this commit.
                    curl -sf -X DELETE "${AUTH[@]}" "${BASE}/git/refs/tags/latest" || true
                    curl -sf -X POST "${AUTH[@]}" "${CT[@]}" \
                        -d "{\"ref\":\"refs/tags/latest\",\"sha\":\"${GH_SHA}\"}" \
                        "${BASE}/git/refs"

                    # 2) Delete any existing 'latest' release (drops all assets atomically).
                    # Tolerate a missing release: without the '|| true' guard, a 404 here
                    # (which happens after a prior run deleted the release and then failed
                    # before recreating it) makes 'curl -sf' exit 22; under 'set -euo
                    # pipefail' that aborts the job BEFORE the create step, so the release
                    # can never be self-healed. Treat a 404 as "nothing to delete".
                    REL_ID="$(curl -sf "${AUTH[@]}" "${BASE}/releases/tags/latest" | jq -r '.id // empty' || true)"
                    if [ -n "${REL_ID}" ]; then
                        echo "Deleting existing 'latest' release ${REL_ID} (clears stale/broken assets)"
                        curl -sf -X DELETE "${AUTH[@]}" "${BASE}/releases/${REL_ID}" || true
                    fi

                    # 3) Create a fresh 'latest' release pointing at this commit.
                    REL="$(curl -sf -X POST "${AUTH[@]}" "${CT[@]}" \
                        -d "{\"tag_name\":\"latest\",\"name\":\"Latest build\",\"target_commitish\":\"${GH_SHA}\",\"make_latest\":\"true\",\"generate_release_notes\":true}" \
                        "${BASE}/releases")"
                    NEW_ID="$(printf '%s' "${REL}" | jq -r '.id')"
                    # The API returns upload_url as a URL TEMPLATE with a
                    # "{?name,label}" placeholder suffix (e.g.
                    # https://uploads.github.com/.../releases/405251637/assets{?name,label}).
                    # Appending "?name=X" AFTER that literal template yields a malformed
                    # URL (assets{?name,label}?name=X) and GitHub rejects the upload, so
                    # strip the template suffix first.
                    UP_URL="$(printf '%s' "${REL}" | jq -r '.upload_url')"
                    UP_URL="${UP_URL%\{?name,label\}}"
                    echo "Created release ${NEW_ID}"

                    # 4) Upload each jar (name preserves the MC-version suffix).
                    for j in "${JARS[@]}"; do
                        f="$(basename "${j}")"
                        echo "Uploading ${f}"
                        curl -sf -X POST "${AUTH[@]}" \
                            -H "Content-Type: application/java-archive" \
                            --data-binary "@${j}" \
                            "${UP_URL}?name=${f}"
                    done
                    echo "Done: published release ${NEW_ID} with ${#JARS[@]} jar(s)"
