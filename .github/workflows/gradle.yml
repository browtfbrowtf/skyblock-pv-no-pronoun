name: Build Release

# Controls when the action will run.
# Publishes a rolling "latest" release on every push to master (this is the
# branch this fork maintains), and can also be triggered manually.
on:
  workflow_dispatch:
  push:
    branches:
      - master

# The built-in GITHUB_TOKEN can publish a release in THIS repo with contents:write,
# so no custom API key / PAT is required.
permissions:
  contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version: [ '26.1', '26.2', '26.3' ]
        steps:
            -   uses: actions/checkout@v5
            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '25'
            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5
            -   run: chmod +x gradlew
            -   name: Build
                run: ./gradlew :${{ matrix.version }}:build
            -   name: Upload Artifact ${{ matrix.version }}
                uses: actions/upload-artifact@v7.0.0
                with:
                    archive: false
                    path: build/libs/*-${{ matrix.version }}.jar

    # Rolling release: runs ONCE after all matrix legs finish, so the single
    # "latest" release carries every MC-version jar. Reuses the fixed "latest"
    # tag, so each run overwrites the same release and the repo's Latest release
    # is always the freshest build.
    release:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        steps:
            -   name: Download build artifacts
                uses: actions/download-artifact@v4
                with:
                    path: release-assets
            -   name: Publish GitHub Release (rolling "latest")
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: latest
                    name: Latest build
                    target_commitish: ${{ github.sha }}
                    files: release-assets/**
                    make_latest: true
                    generate_release_notes: true
                env:
                    GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
